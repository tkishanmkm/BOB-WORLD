
// android/settings.gradle
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "android"
include ':app'

// This is the main Capacitor Android runtime.
// It's referenced in app/build.gradle, so it needs to be included if building from source.
// Make sure this path is correct and the directory exists after 'npm install'.
include ':capacitor-android'
project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')

// If you later install other Capacitor plugins that have native Android parts
// (e.g., by running 'npm install @capacitor/app'), then running 'npx cap sync android'
// should automatically add their respective 'include' and 'projectDir' lines here.
// The warnings you were seeing were likely because lines for plugins like
// capacitor-app, capacitor-status-bar, etc., were present, but those plugins
// were either not installed in node_modules or their Android native parts were missing.
