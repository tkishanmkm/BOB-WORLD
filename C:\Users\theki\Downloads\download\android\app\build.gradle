plugins {
    id 'com.android.application'
    // id 'org.jetbrains.kotlin.android' // Removed from here
    id 'com.google.gms.google-services'
}

apply plugin: 'kotlin-android' // Added here

// Defines various versions used in the build script
ext {
    // Versions
    // coreSplashScreenVersion = "1.0.1" // Hardcoded below
    // compose_compiler_version = "1.5.12" // Hardcoded below

    // Dependencies
    junitVersion = project.hasProperty('junitVersion') ? project.getProperty('junitVersion') : '4.13.2'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? project.getProperty('androidxJunitVersion') : '1.2.1'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? project.getProperty('androidxEspressoCoreVersion') : '3.6.1'
    androidxAnnotationVersion = project.hasProperty('androidxAnnotationVersion') ? project.getProperty('androidxAnnotationVersion') : '1.8.1'
}

android {
    namespace "com.bankofbaroda.mconnect"
    compileSdk 34

    defaultConfig {
        applicationId "com.bankofbaroda.mconnect"
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName "3.9.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // No specific debug configurations needed for this setup by default
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8 // Keep this for wider Java source compatibility if needed
        targetCompatibility JavaVersion.VERSION_1_8 // Keep this for wider Java target compatibility if needed
    }
    kotlinOptions {
        jvmTarget = '17' // Kotlin JVM target should align with Java 17+
    }
    buildFeatures {
        compose true // Assuming you might use Jetpack Compose
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.12" // Hardcoded version
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    // Added for Capacitor variables
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = variant.name + ".apk"
        }
        // Set a variable for the Android API level
        defทุน varName = "androidApiLevel"
        variant.resValue "string", varName, String.valueOf(variant.applicationId)

        // Set a variable for the App ID
        varName = "appId"
        variant.resValue "string", varName, variant.applicationId

        // Set a variable for the App Name
        varName = "appName"
        def appName = "BOB World" // You can customize your app name here
        variant.resValue "string", varName, appName

        // Set a variable for the App Version Name
        varName = "appVersionName"
        variant.resValue "string", varName, variant.versionName

        // Set a variable for the App Version Code
        varName = "appVersionCode"
        variant.resValue "string", varName, String.valueOf(variant.versionCode)

        // Set a variable for the server URL based on build type
        def serverUrl = ""
        if (variant.buildType.name == "release") {
            // For release builds, you might use a production server URL
            serverUrl = "https://your-production-server.com"
        } else {
            // For debug builds, you can use a development server or localhost
            // For Capacitor live reload, this is typically http://localhost:PORT
            serverUrl = "http://localhost:9002" // Assuming your Next.js dev server runs on 9002
        }
        varName = "serverUrl"
        variant.resValue "string", varName, serverUrl
    }

}

// Custom task to list APK outputs (for debugging)
tasks.register('listApkOutputs') {
    doLast {
        println "Executing listApkOutputs task..."
        def apkDir = file("$buildDir/outputs/apk/debug")
        if (apkDir.exists() && apkDir.isDirectory()) {
            println "Contents of ${apkDir}:"
            apkDir.eachFile { file ->
                println file.name
            }
        } else {
            println "Directory ${apkDir} does not exist or is not a directory."
        }
    }
}


dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0" // Added for CoordinatorLayout
    implementation project(':capacitor-android')
    testImplementation "junit:junit:${junitVersion}"
    androidTestImplementation "androidx.test.ext:junit:${androidxJunitVersion}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${androidxEspressoCoreVersion}"
    implementation "androidx.core:core-splashscreen:1.0.1" // Hardcoded version

    // Jetpack Compose dependencies (if you plan to use Compose)
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Activity and Fragment KTX for modern Android development
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'

    // Lifecycle components
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.4"

    // Capacitor plugins if you had them (example, these are not currently in your package.json)
    // implementation project(':capacitor-app')
    // implementation project(':capacitor-haptics')
    // implementation project(':capacitor-keyboard')
    // implementation project(':capacitor-status-bar')

    // Firebase (ensure this matches your root build.gradle)
    implementation platform('com.google.firebase:firebase-bom:33.2.0') // Check for latest BOM
    implementation 'com.google.firebase:firebase-analytics' // Example Firebase library
    // Add other Firebase SDKs as needed: implementation 'com.google.firebase:firebase-auth'

}

